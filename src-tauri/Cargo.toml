[package]
name = "diffrel-tauri"
version = "0.1.0"
description = "UI for diffrel object centric relation cardinality comparison"
authors = ["cpitsch"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "diffrel_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.2"
process_mining = { version = "0.5.5", features = ["ocel-sqlite"] }
diffrel = { version = "0.1.0", path = "../../diffrel", features = ["rayon"] }
# Native Sugiyama-style layout engine, MIT OR Apache-2.0: https://github.com/aarkue/propel/tree/main/engine/viz-layout
# Pinned (not branch = "main") for reproducibility; bump the rev deliberately, not implicitly.
viz-layout = { git = "https://github.com/aarkue/propel", rev = "b0b6bebd1d179a441dd557e8a053b4f98f970369" }

