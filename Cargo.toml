[package]
name = "diffrel-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
process_mining = { version = "0.5.5", features = ["ocel-sqlite"] }
diffrel = { path = "../diffrel", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
